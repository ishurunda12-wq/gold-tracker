name: Update gold prices

on:
  schedule:
    # Every-30-minute runs come from cron-job.org (see api-notes.md), not from here
    - cron: "15 10 * * *"    # 10:15 UTC = 3:45 PM IST, daily history refresh
  workflow_dispatch:          # adds a "Run workflow" button for manual runs
    inputs:
      history:
        description: "Also refresh 1-year history?"
        default: "true"
        required: false

permissions:
  contents: write             # lets the robot save files back to the repository

concurrency:
  group: update-prices
  cancel-in-progress: false   # never run two at once

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Run the scraper
        env:
          PCJ_API_KEY: ${{ secrets.PCJ_API_KEY }}
        run: python scraper.py

      - name: Refresh 1-year history (daily, or when run by hand)
        if: github.event.schedule == '15 10 * * *' || (github.event_name == 'workflow_dispatch' && inputs.history != 'false')
        run: python fetch_history.py

      - name: Save new prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json gold_history.csv
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Update prices"
            git pull --rebase
            git push
          fi

      - name: Alert if a seller newly broke
        run: |
          python -c "
          import json, sys
          alerts = json.load(open('prices.json')).get('alerts', [])
          if alerts:
              print('No price for over 3 hours from:', ', '.join(alerts))
              print('Check the Run the scraper step above for the error.')
              sys.exit(1)
          print('All good')
          "
